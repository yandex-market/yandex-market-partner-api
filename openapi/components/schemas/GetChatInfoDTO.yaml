description: Информация о чате.
type: object
required:
  - chatId
  - context
  - type
  - status
  - createdAt
  - updatedAt
properties:
  chatId:
    description: Идентификатор чата.
    type: integer
    format: int64
    minimum: 1
  orderId:
    description: |
      {% note warning "Параметр устарел и будет отключен 19.10.2026." %}

      Вместо него используйте `context`.

      {% endnote %}

      Идентификатор заказа.
    type: integer
    format: int64
    minimum: 1
    deprecated: true
    x-deprecation-config:
      shutdown-date: '2026-10-19'
      replacement-field: context
  context:
    $ref: ./ChatFullContextDTO.yaml
  type:
    $ref: ./ChatType.yaml
  status:
    $ref: ./ChatStatusType.yaml
  createdAt:
    description: |
      Дата и время создания чата.

      Формат даты: ISO 8601 со смещением относительно UTC.
    type: string
    format: date-time
    example: '2017-11-21T00:00:00+03:00'
  updatedAt:
    description: |
      Дата и время последнего сообщения в чате.

      Формат даты: ISO 8601 со смещением относительно UTC.
    type: string
    format: date-time
    example: '2017-11-21T00:00:00+03:00'
