description: |
  Информация о товарах в каталоге.
type: object
allOf:
  - description: >
      Идентификатор карточки на Маркете. Показывает текущую привязку товара к
      карточке.


      Может отсутствовать в ответе, если товар еще не привязан к карточке.
      Проверьте статус карточки или исправьте ошибки.
    $ref: ./UpdateMappingDTO.yaml
  - properties:
      marketSkuName:
        description: |
          Название карточки товара.

          Может отсутствовать в ответе, если товар еще не привязан к карточке.
        type: string
      marketModelName:
        description: "{% note warning \"Параметр устарел и будет отключен 12.10.2026.\" %}\n\n\_\n\n{% endnote %}\n\nНазвание модели на Маркете.\n\nМожет отсутствовать в ответе, если товар еще не привязан к карточке.\n"
        type: string
        deprecated: true
        x-deprecation-config:
          shutdown-date: '2026-10-12'
      marketCategoryId:
        description: >
          Идентификатор категории на Маркете, в которую попал товар.


          Может отсутствовать в ответе, если Маркет еще не определил категорию
          товара.
        type: integer
        format: int64
      marketCategoryName:
        description: >
          Название категории карточки на Маркете.


          Может отсутствовать в ответе, если Маркет еще не определил категорию
          товара.
        type: string
