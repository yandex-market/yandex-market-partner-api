description: >
  Ячейка таблицы размеров: значение размера в размерной сетке или значение
  обмера.


  Укажите колонку в `sizeChartId`, `sizeChartName` или в обоих полях, а значение
  — в `sizeValueId`, `sizeValue`

  или в обоих полях. Ячейка, в которой нет ни `sizeChartId`, ни `sizeChartName`
  или ни `sizeValueId`,

  ни `sizeValue`, — ошибка `INVALID_REQUEST`.


  Колонка по `sizeChartName` ищется среди размерных сеток и обмеров размерной
  характеристики таблицы

  из ответа метода `POST v2/businesses/{businessId}/size-tables/charts`:
  название сравнивается без учета регистра

  и пробелов в начале и в конце. Если название совпадает с несколькими колонками
  или ни с одной, возвращается

  ошибка `UNKNOWN_SIZE_CHART`. Переданный вместе с `sizeChartId` параметр
  `sizeChartName` должен совпадать

  с названием этой колонки, иначе вернется ошибка `INVALID_REQUEST`.


  Как обрабатывается значение:


  * Если передан `sizeValueId`, он должен быть из справочника этой размерной
  сетки (`sizeValues` в ответе метода
    `POST v2/businesses/{businessId}/size-tables/charts`). Сохраняется текст значения из справочника.
    Переданный вместе с `sizeValueId` параметр `sizeValue` должен совпадать с этим текстом без учета регистра
    и пробелов в начале и в конце.
  * Если передан только `sizeValue`, из него удаляются пробелы в начале и в
  конце, а затем:
    * пустое значение сохраняется как «нет значения»;
    * «нет значения» принимается в любой колонке и сохраняется как `—`;
    * в колонке со справочником значение сравнивается со справочником без учета регистра — если совпадает
      ровно одно значение, сохраняется оно с текстом из справочника;
    * в колонке без справочника сохраняется переданный текст не длиннее 20 символов, а в обмерах запятые
      заменяются точками: `42,5` → `42.5`.

  Если значение не подходит колонке, возвращается ошибка `INVALID_SIZE_VALUE`.


  {% cut "Какие значения считаются «нет значения»" %}


  Значение целиком, без учета регистра: `Нет`, `Пусто`, `Нет значения`, `Не
  соответствует`, `Нет подходящего`,

  `Отсутствует`, `Неприменимо`, `Без значения` или один либо несколько символов
  `-`, `‐`, `‑`, `‒`, `–`, `—`, `―`.

  Знак минуса `−` к ним не относится.


  В обязательной размерной сетке такое значение, как и пустое значение или
  непереданная ячейка, — ошибка `EMPTY_CELL`.


  {% endcut %}
type: object
properties:
  sizeChartId:
    description: >
      Идентификатор размерной сетки или обмера из ответа метода `POST
      v2/businesses/{businessId}/size-tables/charts`.

      У сеток и обмеров общее пространство идентификаторов. Обязателен, если не
      передан `sizeChartName`.
    type: integer
    format: int64
    minimum: 1
  sizeChartName:
    description: >
      Название размерной сетки или обмера из ответа метода `POST
      v2/businesses/{businessId}/size-tables/charts`.

      Сравнивается без учета регистра и пробелов в начале и в конце.
      Обязательно, если не передан `sizeChartId`.
    type: string
    minLength: 1
    maxLength: 255
  sizeValueId:
    description: >
      Идентификатор значения из справочника размерной сетки. Справочник есть
      только у стандартных размерных сеток Маркета.
    type: integer
    format: int64
    minimum: 1
  sizeValue:
    description: >
      Значение размера или обмера. В колонках без справочника — не длиннее 20
      символов.
    type: string
    maxLength: 255
