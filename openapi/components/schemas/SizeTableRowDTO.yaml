description: >-
  Строка таблицы размеров — один размер во всех размерных сетках и обмерах
  таблицы.
type: object
required:
  - values
properties:
  values:
    description: >
      Ячейки строки в любом порядке. Каждая размерная сетка или обмер — не
      больше одного раза в строке,

      иначе вернется ошибка `INVALID_REQUEST`.


      Ячейку без значения можно не передавать или передать с пустым `sizeValue`:
      она сохранится

      как «нет значения». В обязательной размерной сетке это ошибка
      `EMPTY_CELL`.
    type: array
    minItems: 1
    maxItems: 50
    items:
      $ref: ./SizeTableCellDTO.yaml
