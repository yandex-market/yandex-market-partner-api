description: Значение в ячейке таблицы размеров.
type: object
required:
  - sizeValue
  - rowIndex
properties:
  sizeValueId:
    description: >
      Идентификатор значения размера. Возвращается, только если у колонки есть
      справочник значений — это стандартные размерные сетки Маркета.


      В сетках, созданных бизнесом, брендовых сетках и обмерах значение задается
      только текстом.
    type: integer
    format: int64
  sizeValue:
    description: Значение размера или обмера.
    type: string
  rowIndex:
    description: >
      Номер строки таблицы, начиная с 0. Значения с одинаковым `rowIndex` в
      разных колонках описывают один размер.


      Номера могут идти с пропусками, а порядок строк может не совпадать с
      порядком размеров. Собирайте строки

      по значению `rowIndex`, а не по позиции значения в `sizes`.
    type: integer
    format: int32
    minimum: 0
