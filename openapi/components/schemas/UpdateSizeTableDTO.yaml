description: Новое содержимое таблицы размеров. Заменяет ее целиком.
type: object
required:
  - sizeTableId
  - sizeTableName
  - rows
properties:
  sizeTableId:
    description: Идентификатор таблицы размеров, созданной бизнесом.
    type: integer
    format: int64
    minimum: 1
  sizeTableName:
    description: >
      Новое название таблицы размеров. Пробелы в начале и в конце удаляются.
      Название из одних пробелов —

      ошибка `INVALID_REQUEST`.
    type: string
    minLength: 1
    maxLength: 256
  rows:
    description: >
      Все строки таблицы: каждая описывает один размер. Строки и колонки,
      которых нет в запросе, удаляются.

      При сохранении порядок строк может измениться.
    type: array
    minItems: 1
    maxItems: 200
    items:
      $ref: ./SizeTableRowDTO.yaml
