description: Таблицы размеров для полного обновления.
type: object
required:
  - sizeTables
properties:
  sizeTables:
    description: >
      Таблицы размеров с новым содержимым. Обрабатываются по порядку, каждая
      независимо от остальных.


      Идентификаторы таблиц не должны повторяться в одном запросе. Если
      идентификаторы повторяются,

      запрос не обрабатывается.


      Суммарно во всех таблицах — не больше 5000 ячеек. Если ячеек больше,
      запрос не обрабатывается.
    type: array
    minItems: 1
    maxItems: 10
    items:
      $ref: ./UpdateSizeTableDTO.yaml
