post:
  x-resource-id: 300
  tags:
    - documents
    - dbs
    - fby
    - fbs
    - express
    - laas
  x-auth-scopes:
    - all-methods
    - offers-and-cards-management
  x-allowed:
    - seller
  x-resource-limit-config:
    path: resp
    none:
      amount: 5
      period: minutes
      period-duration: 1
    medium:
      amount: 10
      period: minutes
      period-duration: 1
  x-apphost:
    domain: OFFERS_CATALOG
    enabled: true
  operationId: createDocuments
  summary: Создание документов
  description: "{% include notitle [access](../../_auto/method_scopes/createDocuments.md) %}\n\nСоздает для указанного бизнеса документы на товары. За один запрос можно создать не более 100 документов.\n\nДля привязки документа к товару передайте его номер в поле `certificates` метода\n[POST\_v2/businesses/{businessId}/offer-mappings/update](../../reference/business-offer-mappings/updateOfferMappings.md).\n\nЕсли документ с таким номером уже существует, результат для документа содержит ошибку\n`DOCUMENT_ALREADY_EXISTS`. Существующий документ при этом не возвращается. Ошибка одного документа\nне мешает обработке остальных.\n\n{% include notitle [limit](../../_auto/method_limits/createDocuments.md) %}\n"
  parameters:
    - $ref: ../components/parameters/BusinessId.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/CreateDocumentsRequest.yaml
  responses:
    '200':
      description: >
        Документы, созданные этим запросом, и ошибки создания.


        Если хотя бы один документ не удалось создать, поле `status` принимает
        значение `ERROR`. Остальные

        документы при этом обрабатываются.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/CreateDocumentsResponse.yaml
    '400':
      $ref: ../components/responses/400.yaml
    '401':
      $ref: ../components/responses/401.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '420':
      $ref: ../components/responses/420.yaml
    '500':
      $ref: ../components/responses/500.yaml
