  operationId: getContentSizeTables
  summary: Таблицы размеров по идентификаторам
  description: >
    {% include notitle
    [access](../../_auto/method_scopes/getContentSizeTables.md) %}


    Возвращает таблицы размеров по их идентификаторам. Идентификаторы возвращает
    метод

    подбора таблиц размеров. Если `sizeTableIds` не передан, возвращает все
    таблицы размеров,

    созданные бизнесом.


    Сначала возвращаются созданные бизнесом, затем брендовые, затем стандартные
    таблицы;

    внутри каждой группы — по убыванию идентификатора.


    Результаты возвращаются постранично. Для навигации используйте параметры
    `pageToken` и `limit`.

    В каждом следующем запросе передавайте тот же набор `sizeTableIds`, что и в
    первом:

    `pageToken` привязан к нему, и с другим набором запрос будет отклонен.
    Порядок

    идентификаторов значения не имеет.


    Идентификаторы, по которым таблицу вернуть не удалось — такой таблицы нет
    или она

    принадлежит другому бизнесу, — возвращаются в `notFoundSizeTableIds` на
    первой странице.


    {% include notitle
    [limit](../../_auto/method_limits/getContentSizeTables.md) %}
