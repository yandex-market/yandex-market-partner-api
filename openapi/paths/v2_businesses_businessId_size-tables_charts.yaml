  operationId: getContentSizeCharts
  summary: Размерные сетки и обмеры для таблиц размеров
  description: >
    {% include notitle
    [access](../../_auto/method_scopes/getContentSizeCharts.md) %}


    Возвращает размерные сетки и обмеры, из которых можно составить таблицу
    размеров для указанной размерной

    характеристики. Их идентификаторы передаются в `sizeChartId` ячеек в методах
    создания и обновления таблиц

    размеров `POST v2/businesses/{businessId}/size-tables/create` и `POST
    v2/businesses/{businessId}/size-tables/update`.


    В список входят:


    * стандартные размерные сетки Маркета — значения в них выбираются из
    справочника `sizeValues`;

    * размерные сетки, значения в которых задаются текстом;

    * обмеры — значения в них тоже задаются текстом.


    Брендовые размерные сетки в список не входят, и использовать их в своих
    таблицах нельзя: для них

    возвращается ошибка `UNKNOWN_SIZE_CHART`.


    Обязательные размерные сетки отмечены `required: true`. В таблице должна
    быть хотя бы одна из них,

    а каждую обязательную сетку в таблице нужно заполнить во всех строках.


    Для неизвестного идентификатора размерной характеристики возвращается ошибка
    `UNKNOWN_SIZE_PARAMETER`.


    {% include notitle
    [limit](../../_auto/method_limits/getContentSizeCharts.md) %}
  parameters:
    - $ref: ../components/parameters/BusinessId.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/GetSizeChartsRequest.yaml
  responses:
    '200':
      description: Размерные сетки и обмеры размерной характеристики.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/GetSizeChartsResponse.yaml
    '400':
      description: >
        Запрос содержит неправильные данные. [Подробнее об
        ошибке](../../concepts/error-codes.md#400)


        Коды ошибок:


        * `BAD_REQUEST` — запрос не соответствует описанию метода.

        * `UNKNOWN_SIZE_PARAMETER` — `sizeParameterId` не из списка допустимых
        значений.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ApiClientDataErrorResponse.yaml
    '401':
