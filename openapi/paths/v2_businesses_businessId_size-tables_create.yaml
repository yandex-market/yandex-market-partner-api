    path: resp
    none:
      amount: 5
      period: minutes
      period-duration: 1
    medium:
      amount: 10
      period: minutes
      period-duration: 1
  operationId: createContentSizeTables
  summary: Создание таблиц размеров
  description: "{% include notitle [access](../../_auto/method_scopes/createContentSizeTables.md) %}\n\nСоздает таблицы размеров бизнеса. За один запрос можно создать до 10 таблиц, в которых суммарно не больше\n5000 ячеек. Если таблиц или ячеек больше, запрос отклоняется с ошибкой `BAD_REQUEST` и ни одна таблица\nне создается.\n\nТаблица относится к размерной характеристике, а не к категории: она подбирается для всех категорий\nс той же размерной характеристикой.\n\nРазмерную характеристику категории возвращает метод подбора таблиц размеров\n`POST v2/businesses/{businessId}/size-tables/suggest` в поле `result.sizeParameterId`, характеристику\nсуществующей таблицы — метод `POST v2/businesses/{businessId}/size-tables` в поле `sizeParameterId`.\nЕсли в запросе есть неизвестный идентификатор размерной характеристики, запрос отклоняется с ошибкой\n`UNKNOWN_SIZE_PARAMETER` и ни одна таблица не создается.\n\nРазмерные сетки и обмеры, которые можно использовать в таблице, их значения и обязательные сетки\nвозвращает метод `POST v2/businesses/{businessId}/size-tables/charts`.\n\n{% cut \"Как заполнить таблицу\" %}\n\n{% include notitle [size-tables-filling](../../_includes/common/size-tables-filling.md) %}\n\n{% endcut %}\n\n{% cut \"Чем сохраненная таблица отличается от переданной\" %}\n\n{% include notitle [size-tables-saved-differences](../../_includes/common/size-tables-saved-differences.md) %}\n\nЗначения из ответа можно без изменений передать в метод обновления таблиц размеров\n`POST v2/businesses/{businessId}/size-tables/update`: поля `columnType` и `rowIndex` в нем не учитываются.\n\n{% endcut %}\n\nЧтобы привязать таблицу к товару, передайте ее идентификатор в `value` характеристики с `parameterId: 73979829`\nв запросе [POST\_v2/businesses/{businessId}/offer-cards/update](../../reference/content/updateOfferContent.md).\nКогда таблица изменяется, новое содержимое применяется к привязанным товарам автоматически.\n\n{% note warning \"Повторный запрос создает таблицы еще раз\" %}\n\nМетод не идемпотентен: каждый запрос создает новые таблицы, даже если такие же уже есть.\n\nЕсли запрос завершился ошибкой с кодом 5xx, часть таблиц могла сохраниться. Получите таблицы бизнеса методом\n`POST v2/businesses/{businessId}/size-tables` и только после этого повторите запрос для таблиц, которых там нет.\n\n{% endnote %}\n\nКоличество таблиц у бизнеса ограничено — суммарно по всем размерным характеристикам. Удалить таблицу нельзя.\nЕсли лимит исчерпан, таблица не создается и для нее возвращается ошибка `LIMIT_TABLES`. При одновременных\nзапросах лимит проверяется нестрого, и таблиц может создаться больше.\n\n{% include notitle [limit](../../_auto/method_limits/createContentSizeTables.md) %}\n"
  parameters:
    - $ref: ../components/parameters/BusinessId.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/CreateSizeTablesRequest.yaml
  responses:
    '200':
      description: >
        Результаты создания таблиц в порядке запроса.


        Если хотя бы одну таблицу не удалось создать, поле `status` принимает
        значение `ERROR`.

        Остальные таблицы при этом обрабатываются и сохраняются.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/CreateSizeTablesResponse.yaml
    '400':
      description: >
        Запрос содержит неправильные данные, ни одна таблица не создается.
        [Подробнее об ошибке](../../concepts/error-codes.md#400)


        Коды ошибок:


        * `BAD_REQUEST` — запрос не соответствует описанию метода: например,
        превышено количество таблиц, строк или ячеек.

        * `UNKNOWN_SIZE_PARAMETER` — у одной из таблиц `sizeParameterId` не из
        списка допустимых значений.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ApiClientDataErrorResponse.yaml
    '401':
      $ref: ../components/responses/401.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '404':
      $ref: ../components/responses/404.yaml
    '420':
      $ref: ../components/responses/420.yaml
    '500':
      $ref: ../components/responses/500.yaml
