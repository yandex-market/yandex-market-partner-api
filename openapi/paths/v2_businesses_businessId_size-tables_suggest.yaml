  operationId: suggestContentSizeTables
  summary: Подбор таблиц размеров
  description: >
    {% include notitle
    [access](../../_auto/method_scopes/suggestContentSizeTables.md) %}


    Возвращает таблицы размеров, подходящие для указанной категории, бренда и
    пола.


    Тип `STANDARD` — таблицы, уже созданные Маркетом и автоматически подобранные
    под выбранные

    вами категорию, бренд и пол. Тип `CUSTOM` — таблицы, которые вы создали
    сами: они подходят,

    если у вас свой бренд, уникальная размерная линейка, товары маломерят или
    большемерят.


    Сначала возвращаются созданные бизнесом, затем брендовые, затем стандартные
    таблицы;

    внутри каждой группы — по убыванию идентификатора.


    Результаты возвращаются постранично. Для навигации используйте параметры
    `pageToken` и `limit`.


    {% include notitle
    [limit](../../_auto/method_limits/suggestContentSizeTables.md) %}
  parameters:
    - $ref: ../components/parameters/BusinessId.yaml
    - $ref: ../components/parameters/AliasedPageToken.yaml
    - $ref: ../components/parameters/PageLimit100Default25.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/SuggestSizeTablesRequest.yaml
  responses:
    '200':
      description: Подходящие таблицы размеров.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/SuggestSizeTablesResponse.yaml
    '400':
      $ref: ../components/responses/400.yaml
    '401':
      $ref: ../components/responses/401.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '404':
      $ref: ../components/responses/404.yaml
    '420':
      $ref: ../components/responses/420.yaml
    '500':
      $ref: ../components/responses/500.yaml
