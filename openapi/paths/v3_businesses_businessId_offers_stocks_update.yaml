  summary: Передача информации об остатках
  description: "{% include notitle [access](../../_auto/method_scopes/updateStocksOnPartnerWarehouses.md) %}\n\nПередает данные об остатках товаров на витрине.\n\nОбязательно указывайте SKU **в точности** так, как он указан в каталоге. Например, _557722_ и _0557722_ — это два разных SKU.\n\n{% note info \"Данные в каталоге обновляются не мгновенно\" %}\n\nЭто занимает до нескольких минут.\n\n{% endnote %}\n\n{% note warning \"Метод подходит, только если в кабинете нет групп складов\" %}\n\nЕсли в кабинете есть группы складов, используйте метод [PUT\_v2/campaigns/{campaignId}/offers/stocks](../../reference/stocks/updateStocks.md). [Что такое группы складов и зачем они нужны](https://yandex.ru/support/marketplace/assortment/operations/stocks.html#unified-stocks).\n\n{% endnote %}\n\n{% include notitle [limit](../../_auto/method_limits/updateStocksOnPartnerWarehouses.md) %}\n"
  parameters:
    - $ref: ../components/parameters/BusinessId.yaml
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/UpdateStocksOnWarehousesRequest.yaml
