  operationId: generateStocksReport
  summary: Отчет по остаткам на складах партнера
  description: "{% include notitle [access](../../_auto/method_scopes/generateStocksReport.md) %}\n\nЗапускает генерацию отчета по остаткам на складах магазинов в кабинете. [Что это за отчет](https://yandex.ru/support/marketplace/ru/storage/logistics#remains-history)\n\n**Какая информация вернется:**\n\n* Об остатках на всех складах магазинов в кабинете (модели DBS, FBS и Экспресс).\n* По каждому товару — ваш SKU, название, модель работы, склад, доступное для заказа количество, резерв, цену и статус.\n\nУзнать статус генерации и получить ссылку на готовый отчет можно с помощью запроса [GET\_v2/reports/info/{reportId}](../../reference/reports/getReportInfo.md).\n\n{% list tabs %}\n\n- Все склады магазинов в кабинете\n\n  {% include notitle [reports](../../_auto/reports/offers/stocks_business_config.md) %}\n\n{% endlist %}\n\n{% note warning \"Метод подходит, только если в кабинете нет групп складов\" %}\n\nЕсли в кабинете есть группы складов, используйте метод [POST\_v2/reports/stocks-on-warehouses/generate](../../reference/reports/generateStocksOnWarehousesReport.md). [Что такое группы складов и зачем они нужны](https://yandex.ru/support/marketplace/assortment/operations/stocks.html#unified-stocks).\n\n{% endnote %}\n\n{% include notitle [limit](../../_auto/method_limits/generateStocksReport.md) %}\n"
  parameters:
    - $ref: ../components/parameters/BusinessId.yaml
    - $ref: ../components/parameters/ReportFormat.yaml
  requestBody:
    required: false
    content:
      application/json:
        schema:
          $ref: ../components/schemas/GenerateStocksReportRequest.yaml
  responses:
    '200':
      description: >-
        В ответ приходит идентификатор, который позволяет узнавать статус
        генерации и скачать готовый отчет.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/GenerateReportResponse.yaml
    '400':
      $ref: ../components/responses/400.yaml
    '401':
      $ref: ../components/responses/401.yaml
    '403':
      $ref: ../components/responses/403.yaml
    '404':
      $ref: ../components/responses/404.yaml
    '420':
      $ref: ../components/responses/420.yaml
    '500':
      $ref: ../components/responses/500.yaml
