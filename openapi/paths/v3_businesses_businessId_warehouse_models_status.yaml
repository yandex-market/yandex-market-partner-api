  operationId: updateWarehouseModelStatus
  summary: Включение/выключение модели работы склада
  description: >
    {% include notitle
    [access](../../_auto/method_scopes/updateWarehouseModelStatus.md) %}


    Отключает или включает модель работы (FBS, DBS или Экспресс) для указанного
    склада.


    После отключения модели товары, которые работают по ней на данном складе,
    скрываются через 15 минут. После включения они возвращаются на витрину через
    15 минут, а если модель была выключена 30 дней или дольше — через 4 часа.


    {% include notitle
    [limit](../../_auto/method_limits/updateWarehouseModelStatus.md) %}
