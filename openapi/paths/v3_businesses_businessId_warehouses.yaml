  operationId: getPartnerWarehouses
  summary: Список складов
  description: "{% include notitle [access](../../_auto/method_scopes/getPartnerWarehouses.md) %}\n\nВозвращает список складов кабинета и информацию о них.\n\nДля каждого склада возвращается список моделей работы (FBS, DBS, Экспресс) и доступность API для каждой модели.\n\n{% note warning \"Метод подходит, только если в кабинете нет групп складов\" %}\n\nМетод возвращает только отдельные склады и не возвращает группы складов. Если в кабинете есть группы складов, используйте метод [POST\_v2/businesses/{businessId}/warehouses](../../reference/warehouses/getPagedWarehouses.md). [Что такое группы складов и зачем они нужны](https://yandex.ru/support/marketplace/assortment/operations/stocks.html#unified-stocks).\n\n{% endnote %}\n\n{% include notitle [limit](../../_auto/method_limits/getPartnerWarehouses.md) %}\n"
  parameters:
    - $ref: ../components/parameters/BusinessId.yaml
    - $ref: ../components/parameters/AliasedPageToken.yaml
    - $ref: ../components/parameters/PageLimit30.yaml
  requestBody:
    required: false
    content:
      application/json:
        schema:
          $ref: ../components/schemas/GetPartnerWarehousesRequest.yaml
  responses:
    '200':
      description: Список складов и их свойства, которые вы запрашивали.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/GetPartnerWarehousesResponse.yaml
